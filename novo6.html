<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>

<hr>

<table border="1" width="100%">
    <tr>
        <th>Nome do Comando</th>
        <th>Tags</th>
        <th>Descrição</th>
    </tr>

    <tr>
        <td>Tabelas</td>
        <td>&lt;table&gt;</td> <!-- &lt; e &gt; são caracteres especiais para apenas exibir sem ativar o código -->
        <td>Define uma tabela</td>
    </tr>
    <tr>
        <td>Linhas</td>
        <td>&lt;tr&gt;</td> <!-- tr: uma linha interia da tabela, pega todas as  células em uma linha-->
        <td>Define uma linha na tabela</td>
    </tr>
    <tr>
        <td>Células</td>
        <td>&lt;td&gt;</td> <!-- td: uma célula da tabela, pega apenas uma célula-->
        <td>Define uma célula na tabela</td>
    </tr>
    <tr>
        <td>Cabeçalhos</td>
        <td>&lt;th&gt;</td> <!-- th: uma célula de cabeçalho da tabela, pega apenas uma célula-->
        <td>Define um cabeçalho na tabela</td>
    </tr>
    <tr>
        <td>border e width</td>
        <td>border="1" width="100%"</td>
        <td>Define a borda e a largura da tabela</td>
    </tr>


</table>

</body>
</html>
