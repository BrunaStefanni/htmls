<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body bgcolor="yellow">

    <h1>Olha o fundo colorido!</h1>

<hr>

    <h2><p>Lista não numerada:</p></h2>
   
    <ul> <!-- Lista não numerada com comando "<ul>"-->
        <li>Café</li>
        <li>Leite</li>
        <li>Chá</li>
    </ul>

<hr>

    <h2><p>Lista numerada:</p></h2>
    <ol> <!-- Lista numerada com comando "<ol>"-->
        <li>Café</li>
        <li>Leite</li>
        <li>Chá</li>
    </ol>

<hr>
   <p><h2>Imagem:</h2></p>
    <img src="https://166tech.az/uploads/blogs/33915082.webp" alt="Trulli" width="250" height="166"> <!-- Inserindo uma imagem com comando "<img>"-->

    <p><h2>Imagem animada:</h2></p>
    <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExZTBmcmp0dG9xY2ZqaGxyYW1tbHpmYnR4a2I2eW50azljcXFhend1dCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/o9yi7HGsFlatQZEfos/giphy.gif" alt="Trulli" width="250" height="166"> <!-- Inserindo uma imagem animada com comando "<img>"-->

    <p><h3>Note que a sintaxe de inserção de imagem é igual para imagens estáticas e animadas. A animação depende apenas do formato do arquivo.</h3></p>
</body>
</html>
