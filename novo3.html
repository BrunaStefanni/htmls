<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Como alterar a cor de um texto em HTML</title>
</head>
<body>
    <font color="#FF0000">Este texto está em vermelho</font><br>
    <font color="Yellow">Texto em amarelo</font><br>
    <font color="Blue">Texto em azul</font><br>
    <font style="color:rgb(0,255,0);">Texto em verde</font><br>
<hr>
    <font size="1">Texto tamanho 1</font><br>
    <font size="2">Texto tamanho 2</font><br>
    <font size="3">Texto tamanho 3</font><br>
    <font size="4">Texto tamanho 4</font><br>
    <font size="5">Texto tamanho 5</font><br>
    <font size="6">Texto tamanho 6</font><br>
    <font size="7">Texto tamanho 7</font><br>
<hr>

</body>
</html>
